# Streamlit settings for CAUSAL LAB (read when the app is started from this
# folder: `cd causal_lab && streamlit run app.py`, as in the README).
# Only settings that contradicted what the app tells its user are set here;
# everything else keeps Streamlit's defaults.

[server]
# The app says "Your data remain local" and the README opens it at
# http://localhost:8501. Streamlit's default address (unset) listens on every
# network interface, so anyone on the same network could open the app.
# To share it on purpose, override this when starting it:
#   streamlit run app.py --server.address 0.0.0.0
address = "localhost"

[browser]
# The app says "no data is sent anywhere". Streamlit's default sends usage
# statistics from the browser to Streamlit's servers.
gatherUsageStats = false

[client]
# No "Deploy" button: the app runs on the researcher's own machine.
toolbarMode = "minimal"

# Appearance. Only fonts bundled with Streamlit are used: nothing is
# loaded from the network (tests/test_streamlit_config.py checks it).
[theme]
baseRadius = "0.6rem"
showSidebarBorder = true
metricValueFontSize = "1.9rem"
metricValueFontWeight = 600
headingFontWeights = [700, 650, 600]
chartCategoricalColors = ["#3451B2", "#E07B39", "#2E9E83", "#C2416B", "#7A5AC8", "#8A94A6"]

[theme.light]
primaryColor = "#3451B2"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5FA"
textColor = "#1B2333"
borderColor = "#DDE2EC"
linkColor = "#3451B2"

[theme.light.sidebar]
backgroundColor = "#F6F7FB"

[theme.dark]
primaryColor = "#4F68DF"
backgroundColor = "#0F1420"
secondaryBackgroundColor = "#1A2132"
textColor = "#E6E9F0"
borderColor = "#2A3348"
linkColor = "#8DA2FB"

[theme.dark.sidebar]
backgroundColor = "#141A28"
