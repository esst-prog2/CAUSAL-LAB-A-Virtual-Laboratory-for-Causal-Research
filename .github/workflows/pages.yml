# Publishes the promo page and nothing else from docs/.
# The notes in docs/ (scope note, defense guide, reviews, evaluation files)
# stay in the repository but are not served on github.io.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "docs/img/**"
      - "docs/fonts/**"
      - "docs/video/**"
      - "docs/slides/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy only the page and its assets
        run: |
          mkdir _site
          cp docs/index.html docs/.nojekyll _site/
          cp -r docs/img docs/fonts docs/video docs/slides _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
